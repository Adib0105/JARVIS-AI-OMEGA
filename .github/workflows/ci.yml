name: JARVIS OMEGA CI

on:
  push:
    branches: [main, v7-development]
  pull_request:
    branches: [main, v7-development]

permissions:
  contents: read

jobs:
  test:
    name: linux-regression (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONWARNINGS: error::ResourceWarning
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      SELF_DEVELOPMENT_ENABLED: 'true'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install pip==26.2.1
      - run: pip install -c constraints-release.txt -r requirements.txt
      - run: python -m compileall -f -q .
      - name: Full regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-test-output-${{ matrix.python-version }}
          path: test-output.txt
          if-no-files-found: ignore

  windows-regression:
    name: windows-regression (3.14.7)
    runs-on: windows-latest
    env:
      PYTHONWARNINGS: error::ResourceWarning
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      SELF_DEVELOPMENT_ENABLED: 'true'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.14.7'}
      - run: python -m pip install pip==26.2.1
      - run: pip install -c constraints-release.txt -r requirements.txt
      - run: pip install -c constraints-release.txt -r requirements-windows.txt
      - run: python -m compileall -f -q .
      - name: Full Windows regression suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> windows-test-output.txt
          $code = $LASTEXITCODE
          Get-Content windows-test-output.txt
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-test-output-3.14
          path: windows-test-output.txt
          if-no-files-found: ignore

  windows-build:
    name: exe-and-installer-build
    needs: windows-regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.14.7'}
      - name: Build EXE
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install pip==26.2.1
          .\.venv\Scripts\python.exe -m pip install -c constraints-release.txt -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -c constraints-release.txt -r requirements-windows.txt
          .\.venv\Scripts\python.exe -m pip install -c constraints-release.txt -r requirements-build.txt
          .\build_windows.ps1
          .\dist\JARVIS-OMEGA\JARVIS-OMEGA.exe --first-run-healthcheck | Tee-Object first-run-healthcheck.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged first-run bootstrap healthcheck failed.' }
          .\dist\JARVIS-OMEGA\JARVIS-OMEGA.exe --package-healthcheck | Tee-Object exe-healthcheck.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged EXE healthcheck failed.' }
          .\dist\JARVIS-OMEGA\JARVIS-OMEGA.exe --tts-runtime-healthcheck | Tee-Object tts-runtime-healthcheck.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged TTS worker/runtime healthcheck failed.' }
      - name: Verify secret exclusion
        shell: pwsh
        run: |
          $dist = '.\dist\JARVIS-OMEGA'
          .\.venv\Scripts\python.exe .\scripts\validate_release_bundle.py $dist
          if ($LASTEXITCODE -ne 0) { throw 'Secrets/private runtime data found in bundle.' }
      - name: Build installer from canonical version
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          .\build_installer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $setup = Get-ChildItem '.\dist\installer\JARVIS-AI-OMEGA-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer artifact missing.' }
          if (-not (Test-Path '.\dist\installer\SHA256.txt')) { throw 'Installer checksum evidence missing.' }
          $manifest = (Get-Content '.\dist\installer\SHA256.txt' -Raw).Trim()
          if ($manifest -notmatch '^[0-9a-fA-F]{64}\s{2}JARVIS-AI-OMEGA-Setup-.+\.exe$') { throw 'Updater-compatible checksum manifest is invalid.' }
      - uses: actions/upload-artifact@v6
        with:
          name: jarvis-windows-release-candidate
          path: |
            dist/installer/*
            exe-healthcheck.json
            first-run-healthcheck.json
            tts-runtime-healthcheck.json
          retention-days: 7

  installed-app-validation:
    name: isolated-installer-validation
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jarvis-windows-release-candidate
          path: rc
      - name: Install, repair-upgrade, and validate generated installer only
        shell: pwsh
        run: |
          $setup = Get-ChildItem '.\rc\JARVIS-AI-OMEGA-Setup-*.exe' -Recurse | Select-Object -First 1
          if (-not $setup) { throw 'Installer missing.' }
          $silentArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="desktopicon"')

          Start-Process $setup.FullName -ArgumentList $silentArgs -Wait
          $appDir = Join-Path $env:ProgramFiles 'JARVIS AI OMEGA'
          $exe = Join-Path $appDir 'JARVIS-OMEGA.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing after fresh install.' }

          $legacyExe = Join-Path $appDir 'JARVIS-OMEGA-V7.exe'
          'legacy-binary-placeholder' | Set-Content $legacyExe
          if (-not (Test-Path $legacyExe)) { throw 'Could not seed legacy upgrade residue.' }
          $upgradeData = Join-Path $env:LOCALAPPDATA 'JARVIS AI OMEGA'
          New-Item -ItemType Directory -Force $upgradeData | Out-Null
          $upgradeMarker = Join-Path $upgradeData 'upgrade-preservation-test.txt'
          'preserve-across-upgrade' | Set-Content $upgradeMarker

          Start-Process $setup.FullName -ArgumentList $silentArgs -Wait
          if (Test-Path $legacyExe) { throw 'Historical JARVIS-OMEGA-V7.exe remained after repair/upgrade install.' }
          if (-not (Test-Path $exe)) { throw 'Canonical executable missing after repair/upgrade install.' }
          if (-not (Test-Path $upgradeMarker)) { throw 'User data was unexpectedly deleted during repair/upgrade install.' }

          & $exe --first-run-healthcheck | Tee-Object installed-first-run-healthcheck.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed first-run bootstrap healthcheck failed.' }
          & $exe --package-healthcheck | Tee-Object installed-healthcheck.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed application healthcheck failed.' }
          & $exe --tts-runtime-healthcheck | Tee-Object installed-tts-runtime-healthcheck.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed TTS worker/runtime healthcheck failed.' }
          $uninstall = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -like 'JARVIS AI OMEGA*' | Select-Object -First 1
          if (-not $uninstall) { throw 'Registered uninstaller not found.' }
          $startMenu = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'JARVIS AI OMEGA\JARVIS AI OMEGA.lnk'
          if (-not (Test-Path $startMenu)) { throw "Start Menu shortcut missing: $startMenu" }
          $desktopCandidates = @(
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'JARVIS AI OMEGA.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'JARVIS AI OMEGA.lnk')
          ) | Where-Object { $_ }
          $desktopShortcut = $desktopCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $desktopShortcut) {
            throw "Desktop shortcut missing. Checked: $($desktopCandidates -join '; ')"
          }
      - name: Uninstall and verify user data preservation
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA 'JARVIS AI OMEGA'
          New-Item -ItemType Directory -Force $data | Out-Null
          'preserve-me' | Set-Content (Join-Path $data 'uninstall-preservation-test.txt')
          $entry = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -like 'JARVIS AI OMEGA*' | Select-Object -First 1
          if (-not $entry.UninstallString) { throw 'Uninstall command missing.' }
          $cmd = $entry.UninstallString.Trim('"')
          Start-Process $cmd -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (Test-Path (Join-Path $env:ProgramFiles 'JARVIS AI OMEGA\JARVIS-OMEGA.exe')) { throw 'Application remained after uninstall.' }
          if (-not (Test-Path (Join-Path $data 'uninstall-preservation-test.txt'))) { throw 'User data was unexpectedly deleted.' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: installed-app-validation-evidence
          path: |
            installed-healthcheck.json
            installed-first-run-healthcheck.json
            installed-tts-runtime-healthcheck.json
          if-no-files-found: ignore

  post-packaging-regression:
    name: post-packaging-regression
    needs: installed-app-validation
    runs-on: windows-latest
    env:
      PYTHONWARNINGS: error::ResourceWarning
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      SELF_DEVELOPMENT_ENABLED: 'true'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.14.7'}
      - run: python -m pip install pip==26.2.1
      - run: pip install -c constraints-release.txt -r requirements.txt
      - run: pip install -c constraints-release.txt -r requirements-windows.txt
      - name: Complete post-packaging regression
        shell: pwsh
        run: python -m unittest discover -s tests -v

  publish-release:
    name: publish-verified-github-release
    needs: post-packaging-regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/v7-development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v8
        with:
          name: jarvis-windows-release-candidate
          path: release
      - name: Verify exact release payload
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from jarvis.version import APP_VERSION; print(APP_VERSION)')"
          installer="release/JARVIS-AI-OMEGA-Setup-${version}.exe"
          manifest="release/SHA256.txt"
          test -f "$installer"
          test -f "$manifest"
          installer_name="$(basename "$installer")"
          expected="$(awk -v name="$installer_name" 'tolower($2)==tolower(name){print tolower($1); exit}' "$manifest")"
          test "${#expected}" -eq 64
          actual="$(sha256sum "$installer" | awk '{print tolower($1)}')"
          test "$actual" = "$expected"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
      - name: Publish release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          INSTALLER: ${{ steps.release_meta.outputs.installer }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving verified published release unchanged."
            exit 0
          fi
          gh release create "$tag" "$INSTALLER" release/SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "JARVIS AI OMEGA ${VERSION}" \
            --notes "Verified Windows update for JARVIS AI OMEGA ${VERSION}. Published only after regression, Windows build, isolated installer validation, upgrade/data-preservation validation, and post-packaging regression passed for this exact commit."
