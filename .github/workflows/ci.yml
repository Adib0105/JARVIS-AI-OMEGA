name: JARVIS OMEGA CI

on:
  push:
    branches: [main, v7-development]
  pull_request:
    branches: [main, v7-development]

permissions:
  contents: read

jobs:
  test:
    name: linux-regression (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONWARNINGS: error::ResourceWarning
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      SELF_DEVELOPMENT_ENABLED: 'true'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints/linux.txt
      - name: Validate installed dependency constraints
        run: python -m pip check
      - name: Dedicated adversarial regressions
        run: python -m unittest discover -s tests -p test_final_hardening.py -v
      - name: Compile all Python
        run: python -m compileall -f -q .
      - name: Full unit integration security evaluation suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-test-output-${{ matrix.python-version }}
          path: test-output.txt
          if-no-files-found: ignore

  account-service:
    name: account-service (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated service dependencies
        run: python -m pip install -r requirements-server.txt -c constraints/linux.txt
      - name: Validate service dependencies
        run: python -m pip check
      - name: Account and subscription HTTP/security suite
        run: python -m unittest discover -s tests_server -v

  windows-regression:
    name: windows-regression (3.14)
    runs-on: windows-latest
    env:
      PYTHONWARNINGS: error::ResourceWarning
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      SELF_DEVELOPMENT_ENABLED: 'true'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Check persisted updater checkpoints with Windows PowerShell 5.1
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File scripts/check_update_checkpoint.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Updater checkpoint regression failed.' }
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints/windows-py314.txt
      - name: Validate installed dependency constraints
        run: python -m pip check
      - name: Dedicated adversarial regressions
        run: python -m unittest discover -s tests -p test_final_hardening.py -v
      - name: Compile all Python
        run: python -m compileall -f -q .
      - name: Full Windows regression suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> windows-test-output.txt
          $code = $LASTEXITCODE
          Get-Content windows-test-output.txt
          if ($code -ne 0) { exit $code }
      - name: Upload Windows test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-test-output-3.14
          path: windows-test-output.txt
          if-no-files-found: ignore

  windows-package-smoke:
    name: windows-package-smoke (3.14)
    needs: windows-regression
    runs-on: windows-latest
    env:
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -c constraints/windows-py314.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt -c constraints/windows-py314.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows.txt -c constraints/windows-py314.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-offline-voice.txt -c constraints/windows-py314.txt
      - name: Capture Windows dependency inventory and installed hashes
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts/dependency_inventory.py --output windows-dependencies.json
          .\.venv\Scripts\python.exe -m pip freeze > windows-resolved.txt
      - name: Assign increasing release version
        shell: pwsh
        run: |
          $Version = "7.9.$env:GITHUB_RUN_NUMBER"
          "__version__ = '$Version'" | Set-Content jarvis/__init__.py -Encoding utf8
          $Version | Set-Content build-version.txt
      - name: Build V7 Windows application
        shell: pwsh
        run: .\build_windows.ps1
      - name: Scan packaged files before execution
        shell: pwsh
        timeout-minutes: 20
        run: .\scripts\check_windows_defender.ps1 -Target dist/JARVIS-OMEGA-V7 -Report defender-package.json
      - name: Verify package and secret exclusion
        shell: pwsh
        run: |
          .\scripts\check_windows_package.ps1
      - name: Build Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          .\build_installer.ps1
      - name: Scan installer before execution
        shell: pwsh
        timeout-minutes: 20
        run: .\scripts\check_windows_defender.ps1 -Target dist/installer/JARVIS-AI-OMEGA-V7-Setup.exe -Report defender-installer.json
      - name: Verify installer and update lifecycle
        shell: pwsh
        run: .\scripts\check_windows_installer.ps1
      - name: Upload tested installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JARVIS-Windows-Setup
          path: |
            dist/installer/JARVIS-AI-OMEGA-V7-Setup.exe
            build-version.txt
            defender-package.json
            defender-installer.json
            windows-dependencies.json
            windows-resolved.txt
      - name: Upload Defender evidence even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: defender-scan-evidence
          path: defender-*.json
          if-no-files-found: warn
      - name: Upload desktop launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-launch-evidence
          path: |
            desktop-smoke.json
            desktop-smoke.png
            installed-desktop-smoke.json
            installed-desktop-smoke.png
            dist/installer/update-result.txt
            dist/installer/update-result.txt.install.log
          if-no-files-found: ignore
      - name: Upload package smoke artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JARVIS-OMEGA-V7-windows-smoke
          path: dist/JARVIS-OMEGA-V7
          retention-days: 3

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve constrained desktop and service dependencies
        run: python -m pip install -r requirements.txt -r requirements-server.txt -c constraints/linux.txt
      - name: Capture dependency license and file-hash inventory
        run: python scripts/dependency_inventory.py --output dependency-inventory.json
      - name: Run vulnerability audit (unavailable feed is a failure)
        run: |
          python -m venv audit-tools
          audit-tools/bin/python -m pip install pip-audit==2.10.1
          site=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          audit-tools/bin/python -m pip_audit --path "$site" --format json --output vulnerabilities.json
      - name: Audit the pinned Windows build dependency set
        run: audit-tools/bin/python -m pip_audit -r constraints/windows-py314.txt --no-deps --disable-pip --format json --output windows-vulnerabilities.json
      - name: Preserve dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-audit-evidence
          path: |
            dependency-inventory.json
            vulnerabilities.json
            windows-vulnerabilities.json

  publish-release:
    # Release remains blocked until FINAL-HARDENING-AUDIT mandatory findings close.
    if: ${{ false }}
    needs: [test, account-service, windows-regression, windows-package-smoke, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: JARVIS-Windows-Setup
          path: release
      - name: Publish tested Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < release/build-version.txt)
          printf '%s\n' 'Windows Setup: desktop shortcut, background tray, in-app updates and faster local replies.' 'Settings and data are preserved during in-place updates.' 'Validated by Linux/Windows tests, packaged desktop launch and installer/upgrade checks.' > release-notes.txt
          gh release create "v$version" release/dist/installer/JARVIS-AI-OMEGA-V7-Setup.exe release/defender-package.json release/defender-installer.json --target "$RELEASE_COMMIT" --title "JARVIS Friday $version" --notes-file release-notes.txt
