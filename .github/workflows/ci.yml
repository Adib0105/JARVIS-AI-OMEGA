name: JARVIS OMEGA CI

on:
  push:
    branches: [main, v7-development]
  pull_request:
    branches: [main, v7-development]

permissions:
  contents: read

jobs:
  quality-security:
    name: critical-quality-and-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Critical Python correctness lint
        run: ruff check . --select E9,F63,F7,F82
      - name: High-severity static security scan
        run: bandit -r jarvis *.py -lll
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-audit.txt --progress-spinner off

  test:
    name: linux-regression (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONWARNINGS: error::ResourceWarning
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      SELF_DEVELOPMENT_ENABLED: 'true'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -f -q .
      - name: Full unit integration security evaluation suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-output-${{ matrix.python-version }}
          path: test-output.txt
          if-no-files-found: ignore

  windows-regression:
    name: windows-regression (3.14)
    runs-on: windows-latest
    env:
      PYTHONWARNINGS: error::ResourceWarning
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      SELF_DEVELOPMENT_ENABLED: 'true'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -f -q .
      - name: Full Windows regression suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> windows-test-output.txt
          $code = $LASTEXITCODE
          Get-Content windows-test-output.txt
          if ($code -ne 0) { exit $code }
      - name: Upload Windows test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output-3.14
          path: windows-test-output.txt
          if-no-files-found: ignore

  windows-package-smoke:
    name: windows-package-smoke (3.14)
    needs: [quality-security, windows-regression]
    runs-on: windows-latest
    env:
      OPENROUTER_API_KEY: test-key-not-used
      AI_PROVIDER: openrouter
      ENABLE_MIC_INPUT: 'false'
      ENABLE_GOOGLE_WORKSPACE: 'false'
      PRODUCTION_SELF_MODIFICATION: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
      - name: Install Windows runtime dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-windows.txt
      - name: Build V7.5 Windows application
        shell: pwsh
        run: .\build_windows.ps1
      - name: Verify package and secret exclusion
        shell: pwsh
        run: |
          $dist = '.\dist\JARVIS-OMEGA-V7.5'
          $exe = Join-Path $dist 'JARVIS-OMEGA-V7.5.exe'
          if (-not (Test-Path $exe)) { throw "Packaged EXE missing: $exe" }
          $forbidden = Get-ChildItem $dist -Recurse -File | Where-Object {
            $_.Name -eq '.env' -or
            $_.Extension -in @('.db', '.sqlite', '.sqlite3') -or
            $_.Name -in @('google_token.json', 'google_credentials.json')
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host "FORBIDDEN BUNDLE FILE: $($_.FullName)" }
            throw 'Secrets/private runtime data must not be bundled.'
          }
          Write-Host "Package smoke PASS: $exe"
      - name: Upload package smoke artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-OMEGA-V7.5-windows-smoke
          path: dist/JARVIS-OMEGA-V7.5
          retention-days: 3
